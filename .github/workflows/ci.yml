name: CI Pipeline

# 1. The Trigger
on:
  push:
    branches:
      - main

# 2. The Work
jobs:
  build-and-test:
    # 3. The Environment
    runs-on: ubuntu-latest

    # 4. The Steps
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

      - name: Build Docker Image
        run: |
          docker build -t my-fastapi-app .